<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel | Reyes Ornamental Supply</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--iron:#2a2a2a;--rust:#b5451b;--sand:#e8dcc8;--cream:#f5f0e8;--warm-white:#faf8f4;--copper:#c47a3b;--patina:#4a6b5a;--dark:#1a1a1a;--text:#3a3a3a;--green:#2d7a4f;--red:#c0392b}
body{font-family:'DM Sans',sans-serif;color:var(--text);background:#f0ece4;min-height:100vh}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--iron);position:relative;overflow:hidden}
.login-page::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent,transparent 59px,rgba(255,255,255,.03) 59px,rgba(255,255,255,.03) 60px),repeating-linear-gradient(0deg,transparent,transparent 59px,rgba(255,255,255,.03) 59px,rgba(255,255,255,.03) 60px)}
.login-box{position:relative;z-index:1;width:100%;max-width:400px;padding:48px 40px;background:var(--warm-white);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-box h1{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--iron);margin-bottom:4px}
.login-box .sub{font-size:.85rem;color:rgba(42,42,42,.5);margin-bottom:32px}
.login-box label{font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(42,42,42,.5);display:block;margin-bottom:6px}
.login-box input[type="password"]{width:100%;padding:12px 16px;border:2px solid rgba(42,42,42,.1);font-family:'DM Sans',sans-serif;font-size:1rem;background:white;outline:none;transition:border-color .3s;margin-bottom:20px}
.login-box input:focus{border-color:var(--rust)}
.login-btn{width:100%;padding:14px;background:var(--rust);color:var(--cream);font-family:'DM Sans',sans-serif;font-weight:700;font-size:1rem;border:none;cursor:pointer;transition:all .3s}
.login-btn:hover{background:var(--copper)}
.login-error{color:var(--red);font-size:.85rem;margin-top:12px;display:none}
.admin{display:none}
.admin-nav{background:var(--dark);padding:14px 32px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.admin-nav .logo{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;color:var(--cream)}
.admin-nav .logo em{font-style:normal;color:var(--rust)}
.admin-nav .logo span{font-size:.75rem;background:var(--rust);color:white;padding:2px 8px;margin-left:8px;vertical-align:middle;letter-spacing:.1em}
.logout-btn{padding:8px 16px;background:none;border:1px solid rgba(232,220,200,.2);color:rgba(232,220,200,.6);font-size:.8rem;cursor:pointer;transition:all .3s;font-family:'DM Sans',sans-serif}
.logout-btn:hover{border-color:var(--rust);color:var(--cream)}
.admin-body{max-width:1100px;margin:0 auto;padding:32px 24px}
.admin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;flex-wrap:wrap;gap:16px}
.admin-header h2{font-family:'Playfair Display',serif;font-size:1.6rem;color:var(--iron)}
.admin-header .view-site{padding:10px 20px;background:var(--patina);color:white;text-decoration:none;font-size:.85rem;font-weight:500;transition:all .3s}
.cat-tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.cat-tab{padding:10px 20px;background:white;border:2px solid rgba(42,42,42,.08);font-family:'DM Sans',sans-serif;font-size:.85rem;cursor:pointer;transition:all .3s;color:var(--text)}
.cat-tab:hover{border-color:rgba(181,69,27,.3)}
.cat-tab.active{border-color:var(--rust);background:rgba(181,69,27,.06);color:var(--rust);font-weight:700}
.product-table{width:100%;background:white;border:1px solid rgba(42,42,42,.08);border-collapse:collapse}
.product-table th{text-align:left;padding:14px 16px;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(42,42,42,.5);background:var(--cream);border-bottom:2px solid rgba(42,42,42,.08)}
.product-table td{padding:14px 16px;border-bottom:1px solid rgba(42,42,42,.06);font-size:.9rem;vertical-align:middle}
.product-table tr:hover{background:rgba(181,69,27,.02)}
.price-input{width:100px;padding:8px 10px;border:2px solid rgba(42,42,42,.1);font-family:'DM Sans',sans-serif;font-size:.95rem;background:var(--warm-white);outline:none;transition:all .3s;text-align:right}
.price-input:focus{border-color:var(--rust);background:white}
.price-input.saved{border-color:var(--green);background:rgba(45,122,79,.05)}
.price-input.error{border-color:var(--red);background:rgba(192,57,43,.05)}
.status-badge{display:inline-block;padding:3px 10px;font-size:.75rem;font-weight:700}
.status-badge.active{background:rgba(45,122,79,.1);color:var(--green)}
.status-badge.inactive{background:rgba(192,57,43,.1);color:var(--red)}
.toggle-btn{padding:6px 12px;font-size:.75rem;cursor:pointer;border:1px solid rgba(42,42,42,.15);background:white;font-family:'DM Sans',sans-serif;transition:all .2s}
.toggle-btn:hover{border-color:var(--rust)}
.toast{position:fixed;bottom:24px;right:24px;padding:14px 24px;background:var(--green);color:white;font-size:.9rem;font-weight:500;transform:translateY(100px);opacity:0;transition:all .4s ease;z-index:1000;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.toast.show{transform:translateY(0);opacity:1}
.toast.error{background:var(--red)}
@media(max-width:768px){.admin-body{padding:20px 12px}.product-table{font-size:.8rem}.product-table th,.product-table td{padding:10px 8px}.price-input{width:80px}}
</style>
</head>
<body>
<div class="login-page" id="loginPage">
  <div class="login-box">
    <h1>Admin Panel</h1>
    <p class="sub">Reyes Ornamental Supply — Price Management</p>
    <label>Password</label>
    <input type="password" id="loginPassword" placeholder="Enter admin password">
    <button class="login-btn" onclick="handleLogin()">Sign In</button>
    <p class="login-error" id="loginError"></p>
  </div>
</div>
<div class="admin" id="adminPanel">
  <nav class="admin-nav">
    <div class="logo">REYES <em>ORNAMENTAL</em> <span>ADMIN</span></div>
    <button class="logout-btn" onclick="handleLogout()">Sign Out</button>
  </nav>
  <div class="admin-body">
    <div class="admin-header">
      <h2>Product & Price Management</h2>
      <a href="quote.html" target="_blank" class="view-site">View Quote Calculator &rarr;</a>
    </div>
    <div class="cat-tabs" id="catTabs"></div>
    <div id="productArea"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
// CONFIG
var SUPABASE_URL = 'https://xsnztgdqrdbnnxqdhyrm.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhzbnp0Z2RxcmRibm54cWRoeXJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxMTU2MDksImV4cCI6MjA4OTY5MTYwOX0.JwyvhBeVyuLwMMkwykiGHsYc069JEa4xD0nztxlUe_E';
var ADMIN_PASSWORD = 'Outlaw';

// Since RLS is disabled, anon key can read AND write.
// Simple password gate keeps random people out of the admin UI.
var headers = { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY };

var categories = [];
var products = [];
var activeCategory = null;
var saveTimers = {};

// --- SIMPLE PASSWORD LOGIN ---
function handleLogin() {
  var pw = document.getElementById('loginPassword').value;
  if (pw === ADMIN_PASSWORD) {
    localStorage.setItem('reyes_admin', 'true');
    showAdmin();
  } else {
    var err = document.getElementById('loginError');
    err.textContent = 'Wrong password';
    err.style.display = 'block';
  }
}

function handleLogout() {
  Object.keys(saveTimers).forEach(function(k) { clearTimeout(saveTimers[k]); });
  saveTimers = {};
  localStorage.removeItem('reyes_admin');
  document.getElementById('adminPanel').style.display = 'none';
  document.getElementById('loginPage').style.display = 'flex';
}

function showAdmin() {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('adminPanel').style.display = 'block';
  loadData();
}

// --- DATA ---
function supaFetch(table, query) {
  return fetch(SUPABASE_URL + '/rest/v1/' + table + '?' + (query || ''), { cache: 'no-store', headers: headers })
    .then(function(res) { if (!res.ok) throw new Error('Fetch failed: ' + res.status); return res.json(); });
}

function supaUpdate(table, id, data) {
  return fetch(SUPABASE_URL + '/rest/v1/' + table + '?id=eq.' + id, {
    method: 'PATCH', cache: 'no-store', headers: headers, body: JSON.stringify(data)
  }).then(function(res) {
    if (!res.ok) return res.text().then(function(t) { throw new Error('Update failed (' + res.status + '): ' + t); });
    return true;
  });
}

function loadData() {
  Promise.all([
    supaFetch('categories', 'order=sort_order'),
    supaFetch('products', 'order=sort_order')
  ]).then(function(results) {
    categories = results[0];
    products = results[1];
    if (!activeCategory && categories.length) activeCategory = categories[0].id;
    renderTabs();
    renderProducts();
  }).catch(function(err) {
    showToast('Failed to load: ' + err.message, true);
  });
}

// --- RENDER ---
function renderTabs() {
  document.getElementById('catTabs').innerHTML = categories.map(function(c) {
    var count = products.filter(function(p) { return p.category_id === c.id; }).length;
    var isActive = c.id === activeCategory;
    var hidden = !c.is_active;
    return '<button class="cat-tab ' + (isActive ? 'active' : '') + '" onclick="activeCategory=\'' + c.id + '\';renderTabs();renderProducts()" style="' + (hidden ? 'opacity:.5;text-decoration:line-through' : '') + '">' + c.name + ' <span style="font-size:.7rem;color:rgba(42,42,42,.35)">(' + count + ')</span>' + (hidden ? ' <span style="font-size:.6rem;color:var(--red)">HIDDEN</span>' : '') + '</button>';
  }).join('');
}

function renderProducts() {
  var area = document.getElementById('productArea');
  var cat = categories.find(function(c) { return c.id === activeCategory; });
  var catProducts = products.filter(function(p) { return p.category_id === activeCategory; });

  var html = '<div style="display:flex;justify-content:space-between;align-items:center;padding:16px 20px;margin-bottom:16px;background:' + (cat.is_active ? 'rgba(45,122,79,.06)' : 'rgba(192,57,43,.06)') + ';border:1px solid ' + (cat.is_active ? 'rgba(45,122,79,.15)' : 'rgba(192,57,43,.15)') + '"><div><strong>' + cat.name + '</strong> <span class="status-badge ' + (cat.is_active ? 'active' : 'inactive') + '" style="margin-left:8px">' + (cat.is_active ? 'Visible' : 'Hidden') + '</span></div><button class="toggle-btn" style="padding:10px 20px" onclick="toggleCategory(\'' + cat.id + '\',' + !cat.is_active + ')">' + (cat.is_active ? 'Hide Category' : 'Show Category') + '</button></div>';

  if (!catProducts.length) {
    area.innerHTML = html + '<p style="padding:40px;text-align:center;color:rgba(42,42,42,.4)">No products.</p>';
    return;
  }

  html += '<table class="product-table"><thead><tr><th>Product</th><th>Base Price</th><th>Unit</th><th>Status</th><th>Actions</th></tr></thead><tbody>';

  catProducts.forEach(function(p) {
    var unit = p.pricing_unit || cat.pricing_unit || 'each';
    html += '<tr><td><strong>' + p.name + '</strong></td><td><div style="display:flex;align-items:center;gap:4px"><span style="color:#999">$</span><input class="price-input" type="number" step="0.01" value="' + p.base_price + '" onchange="savePrice(\'' + p.id + '\',this)"></div></td><td style="font-size:.8rem;color:#999">' + unit + '</td><td><span class="status-badge ' + (p.is_active ? 'active' : 'inactive') + '">' + (p.is_active ? 'Active' : 'Hidden') + '</span></td><td><button class="toggle-btn" onclick="toggleProduct(\'' + p.id + '\',' + !p.is_active + ')">' + (p.is_active ? 'Hide' : 'Show') + '</button></td></tr>';
  });

  html += '</tbody></table>';
  area.innerHTML = html;
}

// --- SAVE ---
function savePrice(id, el) {
  var val = parseFloat(el.value);
  el.classList.remove('saved', 'error');
  clearTimeout(saveTimers[id]);
  saveTimers[id] = setTimeout(function() {
    supaUpdate('products', id, { base_price: val }).then(function() {
      var p = products.find(function(p) { return p.id === id; });
      if (p) p.base_price = val;
      el.classList.add('saved');
      showToast('Price saved');
      setTimeout(function() { el.classList.remove('saved'); }, 2000);
    }).catch(function(err) {
      el.classList.add('error');
      showToast('FAILED: ' + err.message, true);
    });
  }, 500);
}

function toggleProduct(id, newState) {
  supaUpdate('products', id, { is_active: newState }).then(function() {
    var p = products.find(function(p) { return p.id === id; });
    if (p) p.is_active = newState;
    renderProducts();
    showToast(newState ? 'Product visible' : 'Product hidden');
  }).catch(function(err) { showToast('FAILED: ' + err.message, true); });
}

function toggleCategory(id, newState) {
  supaUpdate('categories', id, { is_active: newState }).then(function() {
    var c = categories.find(function(c) { return c.id === id; });
    if (c) c.is_active = newState;
    renderTabs();
    renderProducts();
    showToast(newState ? 'Category visible' : 'Category hidden');
  }).catch(function(err) { showToast('FAILED: ' + err.message, true); });
}

function showToast(msg, isError) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(function() { t.className = 'toast'; }, 3000);
}

// --- BOOT ---
document.getElementById('loginPassword').addEventListener('keydown', function(e) { if (e.key === 'Enter') handleLogin(); });
if (localStorage.getItem('reyes_admin') === 'true') showAdmin();
</script>
</body>
</html>
